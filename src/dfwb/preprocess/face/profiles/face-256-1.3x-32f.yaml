# Same backend and crop as the parity profile, sampled at 32 uniform frames instead of 64.
id: face-256-1.3x-32f
backend: {name: insightface, model: buffalo_l, det_size: 256, min_score: 0.5}
track: {iou: 0.3, strategy: largest-then-iou}
crop: {scale: 1.3, size: 256, square: true, align: none}
sampling: {mode: uniform, frames: 32}
decode: {library: pyav, color: rgb}
extras: {landmarks: true, mesh: false, masks: false}
