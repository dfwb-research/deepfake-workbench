# A tiny, dependency-free profile for smoke tests and pre-cropped datasets: no detector, just a
# centred square crop.
id: toy-64-center-8f
backend: {name: center}
track: {iou: 0.5, strategy: largest-then-iou}
crop: {scale: 1.0, size: 64, square: true, align: none}
sampling: {mode: uniform, frames: 8}
decode: {library: pyav, color: rgb}
extras: {landmarks: false, mesh: false, masks: false}
