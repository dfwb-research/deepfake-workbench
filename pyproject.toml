[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepfake-workbench"
dynamic = ["version"]
description = "A uniform, plugin-driven workbench for deepfake detection research: datasets → protocols → training → scoring → evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luke Collins", email = "luke.collins@research.deakin.edu.au" }]
keywords = ["deepfake", "forensics", "detection", "benchmark", "pytorch", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6.0.1",
  "platformdirs>=4",
  "numpy>=1.26",
  "click>=8.2",
]

[project.optional-dependencies]
rich       = ["rich>=13"]
eval       = ["scipy>=1.11", "matplotlib>=3.8"]
preprocess = ["opencv-python-headless>=4.9", "av>=12"]
train      = ["torch>=2.6", "torchvision>=0.21", "lightning>=2.4", "timm>=1.0", "safetensors>=0.4"]
hf         = ["deepfake-workbench[train]", "transformers>=4.45"]
peft       = ["deepfake-workbench[train]", "peft>=0.12"]
wandb      = ["wandb>=0.17"]
zoo        = ["torch>=2.6", "torchvision>=0.21", "safetensors>=0.4", "huggingface_hub>=0.24"]
all = ["deepfake-workbench[preprocess,eval,train,hf,peft,zoo,rich]"]
# insightface and wandb are intentionally NOT in [all] (licence / account requirements)

[project.scripts]
dfwb = "dfwb.cli.main:main"

[project.entry-points."dfwb.builtins"]
dfwb = "dfwb._builtins:register"

[project.urls]
Homepage = "https://github.com/dfwb-research/deepfake-workbench"
Documentation = "https://dfwb-research.github.io/deepfake-workbench"
Issues = "https://github.com/dfwb-research/deepfake-workbench/issues"
Changelog = "https://github.com/dfwb-research/deepfake-workbench/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/dfwb/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dfwb"]

# Dev/CI only: this index and the sources below never appear in the published wheel's metadata
# (`explicit = true` keeps it out of the default resolution for anyone depending on this package).
# Users installing `[train]` or `[zoo]` pick their own torch build, as docs/install.md explains.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest>=8",
  "pytest-cov",
  "pytest-xdist",
  "hypothesis",
  "import-linter",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "pre-commit",
  "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF", "PT", "PTH", "TID", "ANN"]
# Any is the honest type at the plugin boundary (registries hold arbitrary objects).
ignore = ["ANN401"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/dfwb"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The whole torch stack is optional (the `train`/`hf`/`peft`/`wandb`/`zoo` extras); the org lint
# job installs only the torch-free dev group, so mypy never sees these packages installed there.
module = [
  "torch",
  "torch.*",
  "torchvision",
  "torchvision.*",
  "lightning",
  "lightning.*",
  "timm",
  "timm.*",
  "safetensors",
  "safetensors.*",
  "transformers",
  "transformers.*",
  "peft",
  "peft.*",
  "wandb",
  "wandb.*",
  "huggingface_hub",
  "huggingface_hub.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy is the optional `[eval]` extra; dfwb.eval imports it lazily, inside functions only.
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  # timing, GPU and network tests run only when asked for, e.g. `pytest -m slow`
  "-m",
  "not slow and not gpu and not network",
]
markers = [
  "slow: long-running test (select with -m slow)",
  "gpu: needs a CUDA device; run locally only",
  "network: needs network access; off in CI",
]
xfail_strict = true
pythonpath = ["."]

[tool.coverage.run]
source = ["dfwb"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.importlinter]
root_package = "dfwb"
include_external_packages = true
# Imports under `if TYPE_CHECKING:` never run (dfwb.core.detector names torch types that way).
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "layers"
name = "dfwb layered architecture"
type = "layers"
containers = ["dfwb"]
layers = [
  "cli",
  "train | score | zoo",
  "models",
  "data | eval | preprocess",
  "protocols",
  "core",
]
exhaustive = true
exhaustive_ignores = ["_version", "_builtins"]

[[tool.importlinter.contracts]]
id = "narrow-edges"
name = "models, score and zoo never import eval or preprocess"
type = "forbidden"
source_modules = ["dfwb.models", "dfwb.score", "dfwb.zoo"]
forbidden_modules = ["dfwb.eval", "dfwb.preprocess"]

[[tool.importlinter.contracts]]
id = "train-no-preprocess"
name = "train never imports preprocess"
type = "forbidden"
source_modules = ["dfwb.train"]
forbidden_modules = ["dfwb.preprocess"]

[[tool.importlinter.contracts]]
id = "score-no-models"
name = "score never imports models (detectors arrive through detector_sources)"
type = "forbidden"
source_modules = ["dfwb.score"]
forbidden_modules = ["dfwb.models"]

[[tool.importlinter.contracts]]
id = "no-downstream"
name = "the framework never imports utility or protocol packages"
type = "forbidden"
source_modules = ["dfwb"]
forbidden_modules = ["dfwb_protocols", "dfwb_torch_srm"]

[[tool.importlinter.contracts]]
id = "torch-free"
name = "torch-free layers never import torch"
type = "forbidden"
source_modules = ["dfwb.core", "dfwb.protocols", "dfwb.eval", "dfwb.preprocess"]
forbidden_modules = ["torch"]

[[tool.importlinter.contracts]]
id = "core-no-numpy"
name = "core never imports numpy"
type = "forbidden"
source_modules = ["dfwb.core"]
forbidden_modules = ["numpy"]
